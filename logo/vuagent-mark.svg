    <path d="M52.65 61.48 L71 20" stroke="#C2410C" stroke-width="6.5"/>
    <circle cx="48" cy="72" r="9.5" stroke="#C2410C" stroke-width="6"/>
    <circle cx="71" cy="20" r="5.5" fill="#C2410C" stroke="none"/>
  </g>
</svg>
