name: Docs & Registry

# 文档站 + shadcn registry 部署到 GitHub Pages：
#   站点    https://hellotombruce.github.io/vuagent/
#   registry https://hellotombruce.github.io/vuagent/r/{name}.json
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm docs:build

      - name: Stage registry + llms.txt
        run: |
          mkdir -p apps/docs/.vitepress/dist/r
          cp packages/ui/registry/*.json apps/docs/.vitepress/dist/r/
          cp llms.txt llms-full.txt apps/docs/.vitepress/dist/
          echo "registry items: $(ls apps/docs/.vitepress/dist/r | wc -l)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
