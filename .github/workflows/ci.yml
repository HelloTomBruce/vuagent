name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Protocol sync check（契约副本卡口）
        run: pnpm protocol:sync-check

      - name: Build
        run: pnpm build

      - name: Generate registry & llms.txt
        run: |
          pnpm registry
          pnpm llms

      # 工件一致性门禁（TASK-009）：改了组件/文档源但不重新生成 → 红
      - name: Registry freshness gate
        run: git diff --exit-code -- packages/ui/registry llms.txt llms-full.txt

      # 自包含门禁（TASK-009）：任何条目存在未随包携带的相对引用 → 红
      - name: Registry self-containment gate
        run: pnpm registry:check

      - name: Docs build
        run: pnpm docs:build
