name: Release

# 版本编排（只做「改版本」，不做发布——发布唯一入口是 .github/workflows/publish.yml）：
#
#   ① Actions → Release → Run workflow，action=version
#      → changesets 消费 .changeset/ 下 pending 变更，生成/更新「Version Packages」PR；
#   ② 人工审阅并合并该 PR（版本号、CHANGELOG 汇总在此定型，同时触发 ci.yml 全量门禁）；
#   ③ 发版：打 tag `v<version>`（push 后自动进 Publish workflow），
#      或 Actions → Publish → Run workflow（channel 见该工作流注释）。
#
# 预发布（alpha/rc）流程：
#   `pnpm exec changeset pre enter next` → 提交 → 走上面 ①~② 得到 0.7.0-alpha.1 →
#   发到 dist-tag `next`（Publish 的 channel=auto 会自动识别）；出正式版前 `changeset pre exit`。
#
# 为何不自动发包：自动发布等于「合并即上线」——主分支任何误合并（半成品 / 提前 bump /
# CI 尚红）都会直接变成一次真实的 npm release，而 unpublish/deprecate 的回撤成本远高于
# 不合格 PR。改版本与发版之间保留人工审阅口；NPM_TOKEN 也只在显式 Publish 的 run 中生效。

on:
  workflow_dispatch:
    inputs:
      action:
        description: "version = 生成/更新 Version Packages PR（发布请用 Publish 工作流）"
        required: true
        type: choice
        default: version
        options:
          - version

# 默认最小权限，按需放大
permissions:
  contents: read

# 同一时间只允许一个版本编排动作
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    if: ${{ github.event.inputs.action == 'version' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # 推 version 分支
      pull-requests: write # 开/更新 Version Packages PR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 官方 changesets action：无 pending changesets 时本次 run 静默结束（不开 PR）
      - uses: changesets/action@v1
        with:
          version: pnpm exec changeset version
          title: "chore(changesets): Version Packages"
          commit: "chore(changesets): Version Packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
